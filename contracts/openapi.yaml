        '200':
          description: 分页历史或回收站；正文搜索在客户端
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClipPage'
        default:
          description: 统一错误体；参见 docs/06-api.md
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: 当前骨架尚未实现此业务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/PageToken'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - trash
          default: active
      - name: source_device_id
        in: query
        schema:
          type: string
          format: uuid
      - name: since
        in: query
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        schema:
          type: string
          format: date-time
