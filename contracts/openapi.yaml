openapi: 3.0.3
info:
  title: OnlineClipboard API
  version: 0.1.0-design
  description: v1 HTTP 契约。健康检查、就绪检查、server-info 及账号/保险库/密文/同步/设备接口已实现；客户端加密，服务端只存密文。
servers:
- url: https://clip.example.com
  description: 替换为用户的服务器 HTTPS origin
security:
- bearerAuth: []
paths:
  /healthz:
    get:
      operationId: health
      summary: 进程存活
      x-implementation: implemented
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          description: 统一错误体；参见 docs/06-api.md
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /readyz:
    get:
      operationId: ready
      summary: 业务就绪（当前固定 503）
      x-implementation: implemented
      responses:
        '200':
          description: 业务就绪（当前固定 503）
        default:
          description: 统一错误体；参见 docs/06-api.md
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 具体业务错误码见接口设计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/v1/server-info:
    get:
      operationId: serverInfo
      summary: 服务能力发现
      x-implementation: implemented
      responses:
        '200':
