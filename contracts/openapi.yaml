      summary: 邀请注册与初始设备会话
      x-implementation: implemented
      responses:
        '201':
          description: 邀请注册与初始设备会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        default:
          description: 统一错误体；参见 docs/06-api.md
          content:
            application/json:
              schema:
