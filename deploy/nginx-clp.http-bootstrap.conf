server {
    listen 80;
    listen [::]:80;
    server_name clp.fjayson.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 200 "onlineclipboard origin pending https\n";
        add_header Content-Type text/plain;
    }
}
