name: onlineclipboard

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: onlineclipboard
      POSTGRES_USER: onlineclipboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onlineclipboard -d onlineclipboard"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ../server
    environment:
      CLIP_HTTP_ADDR: 0.0.0.0:8080
      CLIP_DATABASE_URL: postgres://onlineclipboard:${POSTGRES_PASSWORD}@postgres:5432/onlineclipboard?sslmode=disable
      CLIP_REGISTRATION_MODE: ${CLIP_REGISTRATION_MODE:-invite}
      CLIP_EXTERNAL_AUTH_URL: ${CLIP_EXTERNAL_AUTH_URL:-}
      CLIP_EXTERNAL_REGISTER_URL: ${CLIP_EXTERNAL_REGISTER_URL:-}
      CLIP_EMAIL_BACKEND: ${CLIP_EMAIL_BACKEND:-}
      CLIP_SMTP_HOST: ${CLIP_SMTP_HOST:-}
      CLIP_SMTP_PORT: ${CLIP_SMTP_PORT:-}
      CLIP_SMTP_USERNAME: ${CLIP_SMTP_USERNAME:-}
      CLIP_SMTP_PASSWORD: ${CLIP_SMTP_PASSWORD:-}
      CLIP_SMTP_FROM: ${CLIP_SMTP_FROM:-}
      CLIP_SMTP_SECURE: ${CLIP_SMTP_SECURE:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: [https]
    environment:
      CLIP_DOMAIN: ${CLIP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
